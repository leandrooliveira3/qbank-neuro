<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="background-color: white;">
  <style>
    .text { font-family: sans-serif; font-size: 32px; font-weight: bold; fill: black; text-anchor: middle; }
    .footer { font-family: sans-serif; font-size: 14px; fill: black; text-anchor: end; }
  </style>
  <text x="400" y="100" class="text">Você sabe como fazer.</text>
  <text x="400" y="200" class="text">Descida à Terra.</text>
  <text x="400" y="300" class="text">Cheguei a casa do trabalho.</text>
  <text x="400" y="400" class="text">Perto da mesa, na sala de jantar.</text>
  <text x="400" y="500" class="text">Eles ouviram-no falar na rádio, na noite passada.</text>
  <text x="780" y="580" class="footer">Lista para leitura no item 9. Melhor Linguagem.</text>
</svg>
